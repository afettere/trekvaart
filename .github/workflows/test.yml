name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  sluis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test sluis/spend-ceiling.test.mjs sluis/stranded.test.mjs runners/machinist/sluis-run.test.mjs board/compose.test.mjs board/server.test.mjs
      - run: bash -n install/bootstrap.sh install/firewall.sh runners/machinist/bin/sluis-run runners/machinist/bin/sweep-stranded
