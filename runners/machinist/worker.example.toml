# Machinist worker configuration for Trekvaart. Lives at ~/.machinist/worker.toml.
# Machine-local paths only; commands and triggers belong in config.toml.

data_directory = "~/.machinist/worker"

[control_plane]
url = "http://127.0.0.1:7331"
token_file = "~/.machinist/server/worker.token"

# The flight's executor runs the agent CLI through Trekvaart's wrapper (runners/machinist/bin/sluis-run),
# which refuses to start once the rolling ceiling is reached, turns the CLI's own background-task
# ceiling off, keeps a marker for the sweeper while the agent runs, records each run's usage by
# token class in Trekvaart's own ledger, and repairs a stranded label when the agent exits.
# The flags after the wrapper are the ones Machinist's shipped example uses for Claude Code;
# `{{machinist.model}}` is filled from the trigger's `model` through the `models` map below.
[executors.trekvaart-claude]
command = [
  "/home/machinist/trekvaart/runners/machinist/bin/sluis-run",
  "claude", "--print", "--verbose", "--output-format", "stream-json",
  "--model={{machinist.model}}", "--dangerously-skip-permissions",
]
models = { opus = "claude-opus-5", sonnet = "claude-sonnet-5" }

# The sweeper's executor: a script that reads the repository from the checkout's origin and
# runs `sluis/stranded.mjs sweep` against it. No agent, no model.
[executors.trekvaart-sweep]
command = ["/home/machinist/trekvaart/runners/machinist/bin/sweep-stranded"]

# One entry per repository the worker may run in. The name must match [github.repositories]
# in config.toml. Clone with a write deploy key; the default branch's protection keeps flights off it.
[repositories.product]
path = "/home/machinist/repos/PRODUCT-REPO"
