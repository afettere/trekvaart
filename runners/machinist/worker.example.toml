# Machinist worker configuration for a Trekvaart pilot. Lives at ~/.machinist/worker.toml.
# Machine-local paths only; commands and triggers belong in config.toml.

data_directory = "~/.machinist/worker"

[control_plane]
url = "http://127.0.0.1:7331"
token_file = "~/.machinist/server/worker.token"

# The executor runs the agent CLI through Trekvaart's spend sluis (runners/machinist/bin/sluis-run),
# which refuses to start a flight once the pilot's ceiling is reached and records each run's
# usage by token class in Trekvaart's own ledger. The flags after the wrapper are the ones
# Machinist's shipped example uses for Claude Code; `{{machinist.model}}` is filled from the
# trigger's `model` through the `models` map below.
[executors.trekvaart-claude]
command = [
  "/home/machinist/trekvaart/runners/machinist/bin/sluis-run",
  "claude", "--print", "--verbose", "--output-format", "stream-json",
  "--model={{machinist.model}}", "--dangerously-skip-permissions",
]
models = { opus = "claude-opus-5", sonnet = "claude-sonnet-5" }

# One entry per repository the worker may run in. The name must match [github.repositories]
# in config.toml. Clone with a write deploy key; the default branch's protection keeps flights off it.
[repositories.product]
path = "/home/machinist/repos/PRODUCT-REPO"
